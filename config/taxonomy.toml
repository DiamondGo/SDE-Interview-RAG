# Two levels: a category (exactly one per question) and keyword tags (any number).
# Aliases are matched case-insensitively on word boundaries; the tag key itself is always an alias.
# Keep aliases unambiguous: "go" alone would match ordinary English, so Go is matched by "golang", "goroutine", ...
# Concepts shared by several languages ("decorator", "closure", "coroutines", "hooks") are not aliases: the language name
# (or the source hint, or the LLM tagger) tags those questions.
# Bump `version` after changing aliases: rule-tagged questions are tagged again (LLM tags are kept).

version = 2

# Names accepted from models and users (resolve only), never matched in text because they are ordinary words.
[synonyms]
go = "golang"
k8s = "kubernetes"
ml = "ml-fundamentals"
dl = "deep-learning"
js = "javascript"
ts = "typescript"
node = "nodejs"
dsa = "array"
