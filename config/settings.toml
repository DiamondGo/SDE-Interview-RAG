# Machine-specific overrides go in config/settings.local.toml (not committed).

data_dir = "data"
# Extra dotenv files to load (after the project's .env), e.g. a shared file holding API keys.
env_files = []

[notify]
channels = ["log"]                       # any of: log, desktop, telegram
telegram_token_env = "TELEGRAM_BOT_TOKEN"
telegram_chat_env = "TELEGRAM_CHAT_ID"
repeat_hours = 24                        # an ongoing problem is announced again after this long

[http]
user_agent = "SDE-Interview-RAG/0.1 (personal interview-prep research)"
timeout_s = 30
default_delay_s = 2.0                    # minimum seconds between requests to the same host
max_attempts = 4

[ingest]
doc_limit_per_run = 300                  # documents taken through clean/parse per run
llm_tag_limit_per_run = 600              # questions tagged by the LLM per run
tag_batch = 20
tag_min_batch = 5
lock_ttl_s = 21600
max_attempts = 5                         # a document failing this many times goes to the dead letter
watchdog_idle_s = 1200                   # no record finished for this long: dump stacks, mark stalled, exit (0: off)
source_backoff_max_hours = 48            # a failing source waits 1, 2, 4 ... intervals before trying again
stall_alert = 3                          # stalled model calls in one run that raise an alert
dead_alert_increase = 30                 # new dead letters in one run that raise an alert

[extract]                                # LLM question extraction from interview-experience posts
docs_per_run = 40
part_chars = 6000                        # a post is read in parts of about this size
max_parts = 8                            # longer posts are read up to here
min_part_chars = 1500                    # a failing part is split in half down to this size
min_quote_similarity = 0.8               # a question whose quote does not match the post is discarded
simhash_bits = 3                         # posts this close to one already read are not read again
max_attempts = 3
fabrication_alert = 0.15                 # share of discarded questions in one run that raises an alert

[dedup]                                  # near-duplicate questions (thresholds measured on the M1 data)
merge_at = 0.95                          # merged without asking when the content words also match
judge_from = 0.92                        # from here up, pairs go to the dedup_judge role
pairs_per_question = 2
judge_pairs_per_run = 600
judge_batch = 10

[maintenance]
backup_keep = 7                          # daily backups of rag.db kept in data/backups/
index_retire_days = 7                    # retired index versions are deleted after this long

[watchdog]
failures_before_restart = 2              # failed UI health checks in a row before sde-ui.service is restarted
health_timeout_s = 30

[index]
chunker_version = 1
doc_chunk_chars = 1800
question_answer_chars = 600             # answer text embedded with each question (FTS indexes 4000)
embed_commit_every = 64

[query]
retrieve_k = 50
context_k = 6
topic_k = 30
rrf_k = 60
max_question_chars = 2000
history_turns = 4

[ui]
host = "127.0.0.1"
port = 7860

[dataset]
release_repo = "DiamondGo/SDE-Interview-RAG"   # GitHub repository whose releases hold rag.db.gz (forks: override)
release_keep = 3                               # newest dataset releases kept; older ones are deleted on publish
