[project]
name = "sde-interview-rag"
version = "0.1.0"
description = "RAG over software-engineering interview questions and interview experiences, as LangGraph workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.7",
    "gradio>=5.0",
    "httpx>=0.28",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "numpy>=2.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "trafilatura>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
sde-rag = "sde_rag.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sde_rag"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "agent: calls real model backends (deselected by default; run with -m agent)",
    "integration: needs network or a running langgraph server",
]
addopts = "-m 'not agent and not integration'"
